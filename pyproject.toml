[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dphonevision"
version = "0.1.0"
description = "Conceptual resilient communications platform — Python simulation package for the DPhone concept"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DPhoneVision Contributors" },
]
keywords = ["dphone", "mesh", "seismic", "magnetic-induction", "acoustic", "emergency", "simulation", "stm32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
dphone-sim = "dphone.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/DPhoneVision"
Repository = "https://github.com/your-org/DPhoneVision"

[tool.setuptools.packages.find]
include = ["dphone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["dphone"]
